<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>wxlike</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f5f5f5; height:100vh; overflow:hidden; }
.hidden { display:none !important; }

/* ---- 登录 / 注册 ---- */
#auth { max-width:400px; margin:12vh auto; padding:24px; background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
#auth h1 { font-size:22px; text-align:center; margin-bottom:20px; color:#333; }
#auth input { width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px; font-size:16px; outline:none; }
#auth input:focus { border-color:#07c160; }
.auth-row { display:flex; gap:10px; }
button { padding:12px 20px; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
.btn-primary { background:#07c160; color:#fff; flex:1; }
.btn-ghost { background:#f0f0f0; color:#333; flex:1; }
.auth-err { color:#e64340; font-size:14px; margin-bottom:10px; min-height:18px; text-align:center; }
.mini-btn { font-size:13px; color:#07c160; background:#e8f8ef; padding:6px 10px; border-radius:6px; cursor:pointer; white-space:nowrap; }

/* ---- 头像 (通用) ---- */
.avatar { border-radius:50%; overflow:hidden; flex-shrink:0; background:#ededed; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; }
.avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.av-sm { width:36px; height:36px; }
.av-row { width:44px; height:44px; border-radius:8px; }
.av-lg { width:84px; height:84px; font-size:40px; background:#07c160; border-radius:12px; }

/* ---- 主界面 ---- */
#app { display:flex; height:100vh; }
#sidebar { width:100%; max-width:420px; background:#fff; border-right:1px solid #eee; display:flex; flex-direction:column; }
#chatbox { flex:1; display:flex; flex-direction:column; background:#f5f5f5; }
@media (max-width:768px) {
  #chatbox { position:fixed; inset:0; z-index:10; background:#f5f5f5; transform:translateX(100%); transition:transform .2s; }
  #chatbox.open { transform:translateX(0); }
}

/* 会话列表 / 顶栏 */
#me { padding:12px 14px; border-bottom:1px solid #eee; background:#fff; display:flex; align-items:center; justify-content:space-between; gap:8px; }
#meInfo { display:flex; align-items:center; gap:10px; flex:1; min-width:0; cursor:pointer; }
#meAvatar { background:#07c160; }
#meText { display:flex; flex-direction:column; min-width:0; }
#meName { font-size:16px; color:#1a1a1a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#meUser { font-size:12px; color:#999; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#meActions { display:flex; gap:6px; flex-shrink:0; align-items:center; }
#logout { font-size:13px; color:#888; padding:6px 10px; background:#f2f2f2; border-radius:6px; }
#convs { flex:1; overflow-y:auto; }
.conv { display:flex; padding:12px 16px; border-bottom:1px solid #f5f5f5; cursor:pointer; align-items:center; }
.conv:active { background:#f7f7f7; }
.conv .av { width:44px; height:44px; border-radius:8px; background:#07c160; color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600; margin-right:12px; flex-shrink:0; overflow:hidden; }
.conv .av img { width:100%; height:100%; object-fit:cover; display:block; }
.conv .cmain { flex:1; min-width:0; }
.conv .cname { font-size:16px; color:#222; display:flex; justify-content:space-between; }
.conv .cname .t { color:#999; font-size:12px; font-weight:400; }
.conv .clast { font-size:13px; color:#888; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { background:#fa5151; color:#fff; border-radius:10px; font-size:11px; padding:2px 7px; min-width:18px; text-align:center; }
.offline-tag { font-size:10px; color:#ccc; }

/* 聊天 */
#chathead { padding:12px 16px; background:#fff; border-bottom:1px solid #eee; display:flex; align-items:center; gap:10px; }
#chatback { font-size:20px; color:#888; cursor:pointer; display:none; }
@media (max-width:768px) { #chatback { display:block; } }
#chatHeadInfo { display:flex; align-items:center; gap:8px; flex:1; min-width:0; cursor:pointer; }
#chatHeadInfo b { font-size:16px; }
#chatHeadInfo .st { font-size:12px; color:#999; display:block; }
#msgs { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:75%; padding:9px 12px; border-radius:8px; font-size:15px; line-height:1.45; word-break:break-word; position:relative; }
.msg.mine { align-self:flex-end; background:#95ec69; }
.msg.theirs { align-self:flex-start; background:#fff; }
.msg .meta { font-size:10px; color:#999; margin-top:3px; text-align:right; }
.msg .whorow { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.msg .whorow .avatar { font-size:10px; }
.msg .who { font-size:11px; color:#888; }
.recp { font-size:10px; color:#aaa; margin-left:4px; }
#inputbar { padding:10px 12px; background:#fff; border-top:1px solid #eee; display:flex; gap:8px; align-items:flex-end; }
#inp { flex:1; border:1px solid #ddd; border-radius:8px; padding:10px 12px; font-size:16px; outline:none; min-height:42px; max-height:120px; resize:none; }
#sendbtn { background:#07c160; color:#fff; padding:10px 22px; align-self:flex-end; }

/* 空态 */
.empty { text-align:center; color:#999; padding:60px 20px; font-size:14px; }

/* ---- 通用 modal ---- */
#modal, #devModal, #myModal, #peerModal { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; }
#modal.hidden, #devModal.hidden, #myModal.hidden, #peerModal.hidden { display:none; }
#myModal, #peerModal { z-index:55; }
.mask { position:absolute; inset:0; background:rgba(0,0,0,.4); }
.panel { position:relative; background:#fff; width:min(90vw,340px); border-radius:12px; padding:20px; max-height:75vh; overflow-y:auto; }
.panel h3 { margin-bottom:12px; font-size:17px; }
.panel-close { position:absolute; top:8px; right:12px; font-size:20px; color:#bbb; cursor:pointer; }

/* 群信息 modal */
.member { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f2f2f2; font-size:14px; }
.member .owner-tag { color:#07c160; font-size:11px; margin-left:auto; }
.member.me { color:#333; font-weight:600; }
.grp-ops { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.op-row input { width:100%; padding:8px; border:1px solid #ddd; border-radius:6px; font-size:14px; }
.btn-op { width:100%; padding:9px; border:none; border-radius:6px; font-size:14px; background:#07c160; color:#fff; cursor:pointer; }
.btn-op.danger { background:#f5f5f5; color:#e64340; }

/* 设备 modal */
.dev-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f2f2f2; }
.dev-item .meta { font-size:13px; color:#333; }
.dev-item .sub { font-size:11px; color:#999; margin-top:2px; }
.dev-item .kick { font-size:12px; color:#e64340; cursor:pointer; background:0; border:0; padding:6px 10px; }
.dev-item .this { font-size:11px; color:#07c160; margin-left:6px; }

/* 我的资料 modal */
.prof-preview { display:flex; justify-content:center; margin:6px 0 12px; }
.prof-field { margin-bottom:10px; }
.prof-field label { display:block; font-size:12px; color:#888; margin-bottom:4px; }
.prof-field input, .prof-field textarea { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px; outline:none; font-family:inherit; }
.prof-field textarea { resize:none; min-height:48px; }
.prof-actions { display:flex; justify-content:center; margin-top:14px; }

/* 他人资料卡 modal */
.peer-head { display:flex; flex-direction:column; align-items:center; text-align:center; padding:8px 0 12px; border-bottom:1px solid #f2f2f2; }
.peer-head .pic-lg { margin-bottom:10px; }
.peer-line { padding:10px 0; border-bottom:1px solid #f8f8f8; font-size:14px; display:flex; }
.peer-line .k { color:#999; width:70px; flex-shrink:0; }
.peer-line .v { color:#222; word-break:break-all; }
</style>
</head>
<body>

<!-- 登录/注册 -->
<div id="auth">
  <h1>wxlike</h1>
  <div class="auth-err" id="authErr"></div>
  <input id="aUser" placeholder="用户名" autocomplete="username">
  <input id="aPass" type="password" placeholder="密码" autocomplete="current-password">
  <div class="auth-row">
    <button class="btn-primary" id="loginBtn">登录</button>
    <button class="btn-ghost" id="regBtn">注册并登录</button>
  </div>
  <div style="margin-top:10px;text-align:center">
    <a href="javascript:void(0)" id="forgotLink" style="color:#576b95;font-size:13px;text-decoration:none">忘记密码？</a>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <div id="sidebar">
    <div id="me">
      <div id="meInfo">
        <div id="meAvatar" class="avatar av-sm"></div>
        <div id="meText">
          <div id="meName"></div>
          <div id="meUser"></div>
        </div>
      </div>
      <span id="meActions">
        <span id="devicesBtn" class="mini-btn">设备</span>
        <span id="newGrp" class="mini-btn">+ 建群</span>
        <span id="logout">退出</span>
      </span>
    </div>
    <div id="convs"></div>
  </div>
  <div id="chatbox">
    <div id="chathead" class="hidden">
      <span id="chatback">←</span>
      <div id="chatHeadInfo">
        <div id="chatHeadAvatar" class="avatar av-sm"></div>
        <div>
          <b id="chatName"></b>
          <div class="st" id="chatStatus"></div>
        </div>
      </div>
      <span id="grpInfo" class="mini-btn hidden" style="margin-left:auto">群信息</span>
      <span id="viewProfile" class="mini-btn hidden">名片</span>
    </div>
    <div id="msgs"><div class="empty">选择会话开始聊天</div></div>
    <div id="inputbar" class="hidden">
      <textarea id="inp" placeholder="输入消息..."></textarea>
      <button id="sendbtn">发送</button>
    </div>
  </div>
</div>


<!-- 群信息 modal -->
<div id="modal" class="hidden">
  <div class="mask" id="modalMask"></div>
  <div class="panel">
    <span class="panel-close" id="gClose">&times;</span>
    <h3 id="gTitle">群信息</h3>
    <div id="gMembers"></div>
    <div class="grp-ops">
      <div class="op-row"><input id="gAddUser" placeholder="用户名"></div>
      <button class="btn-op" id="gAdd">加人</button>
      <button class="btn-op" id="gTransfer">转让群主</button>
      <button class="btn-op danger" id="gKick">踢人</button>
      <button class="btn-op danger" id="gLeave">退群</button>
      <button class="btn-op danger" id="gDissolve">解散群</button>
    </div>
  </div>
</div>

<!-- 设备管理 modal -->
<div id="devModal" class="hidden">
  <div class="mask" id="devMask"></div>
  <div class="panel">
    <span class="panel-close" id="devClose">&times;</span>
    <h3>我的设备 <span style="font-size:12px;color:#999;font-weight:400">(在线设备)</span></h3>
    <div id="devList"><div class="empty">加载中...</div></div>
  </div>
</div>

<!-- 我的资料 modal (编辑头像/昵称/签名) -->
<div id="myModal" class="hidden">
  <div class="mask" id="myMask"></div>
  <div class="panel">
    <span class="panel-close" id="myClose">&times;</span>
    <h3>我的资料</h3>
    <div class="prof-preview">
      <div id="myAvatar" class="avatar av-lg"></div>
    </div>
    <button class="btn-op" id="myAvBtn" style="margin-bottom:12px">更换头像 (jpg/png/gif)</button>
    <input type="file" id="myAvFile" accept="image/*" class="hidden">
    <div class="prof-field">
      <label>昵称</label>
      <input id="myName" placeholder="留空则用用户名" maxlength="20">
    </div>
    <div class="prof-field">
      <label>个性签名</label>
      <textarea id="mySig" maxlength="60"></textarea>
    </div>
    <div class="prof-field" style="border-top:1px solid #f0f0f0;padding-top:12px">
      <label>邮箱(找回密码用)</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="myEmail" placeholder="未绑定" style="flex:1" autocomplete="email">
        <button class="btn-op" id="myEmailBtn" style="flex:none;white-space:nowrap">获取验证码</button>
      </div>
      <div id="myCodeRow" class="hidden" style="gap:8px;margin-top:8px">
        <input id="myCode" placeholder="6位验证码" maxlength="6" style="flex:1">
        <button class="btn-primary" id="myCodeBtn" style="flex:none">绑定</button>
      </div>
      <div id="myEmailTip" style="color:#999;font-size:12px;min-height:16px;margin-top:4px"></div>
    </div>
    <div class="prof-field" style="border-top:1px solid #f0f0f0;padding-top:12px">
      <label>修改密码</label>
      <input id="myOldPass" type="password" placeholder="当前密码" autocomplete="current-password">
      <input id="myNewPass" type="password" placeholder="新密码" style="margin-top:8px" autocomplete="new-password">
      <button class="btn-ghost" id="myPassBtn" style="width:100%;margin-top:8px">确认修改密码</button>
      <div id="myPassTip" style="color:#999;font-size:12px;min-height:16px;margin-top:4px"></div>
    </div>
    <div class="prof-field" id="myTip" style="color:#07c160;font-size:12px;min-height:16px"></div>
    <div class="prof-actions">
      <button class="btn-primary" id="mySaveBtn" style="flex:none;width:100%">保存</button>
    </div>
  </div>
</div>

<!-- 忘记密码 modal -->
<div id="forgotModal" class="hidden">
  <div class="mask" id="forgotMask"></div>
  <div class="panel">
    <span class="panel-close" id="forgotClose">&times;</span>
    <h3>找回密码</h3>
    <div class="prof-field">
      <label>用户名或邮箱</label>
      <input id="fgIdent" placeholder="输入用户名或已绑定邮箱" autocomplete="username">
    </div>
    <button class="btn-primary" id="fgSendBtn" style="width:100%">发送验证码</button>
    <div id="fgCodeRow" class="hidden" style="margin-top:12px">
      <div class="prof-field">
        <label>邮箱验证码</label>
        <input id="fgCode" placeholder="6位验证码" maxlength="6">
      </div>
      <div class="prof-field">
        <label>新密码</label>
        <input id="fgNewPass" type="password" placeholder="设置新密码" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="fgResetBtn" style="width:100%">重置密码</button>
    </div>
    <div id="fgTip" style="color:#999;font-size:12px;min-height:16px;margin-top:8px"></div>
  </div>
</div>

<!-- 他人资料卡 modal (只读) -->
<div id="peerModal" class="hidden">
  <div class="mask" id="peerMask"></div>
  <div class="panel">
    <span class="panel-close" id="peerClose">&times;</span>
    <div class="peer-head">
      <div id="peerAvatar" class="avatar av-lg"></div>
      <b id="peerName" style="font-size:17px;margin-top:6px"></b>
    </div>
    <div class="peer-line"><span class="k">用户名</span><span class="v" id="peerUser"></span></div>
    <div class="peer-line"><span class="k">签名</span><span class="v" id="peerSig"></span></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
