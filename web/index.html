<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>wxlike</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f5f5f5; height:100vh; overflow:hidden; }
.hidden { display:none !important; }

/* ---- 登录 / 注册 ---- */
#auth { max-width:400px; margin:12vh auto; padding:24px; background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
#auth h1 { font-size:22px; text-align:center; margin-bottom:20px; color:#333; }
#auth input { width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px; font-size:16px; outline:none; }
#auth input:focus { border-color:#07c160; }
.auth-row { display:flex; gap:10px; }
button { padding:12px 20px; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
.btn-primary { background:#07c160; color:#fff; flex:1; }
.btn-ghost { background:#f0f0f0; color:#333; flex:1; }
.auth-err { color:#e64340; font-size:14px; margin-bottom:10px; min-height:18px; text-align:center; }
.mini-btn { font-size:13px; color:#07c160; background:#e8f8ef; padding:6px 10px; border-radius:6px; cursor:pointer; }

/* ---- 主界面 ---- */
#app { display:flex; height:100vh; }
#sidebar { width:100%; max-width:420px; background:#fff; border-right:1px solid #eee; display:flex; flex-direction:column; }
#chatbox { flex:1; display:flex; flex-direction:column; background:#f5f5f5; }
@media (max-width:768px) {
  #chatbox { position:fixed; inset:0; z-index:10; background:#f5f5f5; transform:translateX(100%); transition:transform .2s; }
  #chatbox.open { transform:translateX(0); }
}

/* 会话列表 */
#me { padding:14px 16px; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; }
#me b { font-size:16px; }
#logout { font-size:13px; color:#888; padding:6px 10px; background:#f2f2f2; border-radius:6px; }
#convs { flex:1; overflow-y:auto; }
.conv { display:flex; padding:12px 16px; border-bottom:1px solid #f5f5f5; cursor:pointer; align-items:center; }
.conv:active { background:#f7f7f7; }
.conv .av { width:44px; height:44px; border-radius:8px; background:#07c160; color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600; margin-right:12px; flex-shrink:0; }
.conv .cmain { flex:1; min-width:0; }
.conv .cname { font-size:16px; color:#222; display:flex; justify-content:space-between; }
.conv .cname .t { color:#999; font-size:12px; font-weight:400; }
.conv .clast { font-size:13px; color:#888; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { background:#fa5151; color:#fff; border-radius:10px; font-size:11px; padding:2px 7px; min-width:18px; text-align:center; }
.offline-tag { font-size:10px; color:#ccc; }

/* 聊天 */
#chathead { padding:12px 16px; background:#fff; border-bottom:1px solid #eee; display:flex; align-items:center; gap:10px; }
#chatback { font-size:20px; color:#888; cursor:pointer; display:none; }
@media (max-width:768px) { #chatback { display:block; } }
#chathead b { font-size:16px; }
#chathead .st { font-size:12px; color:#999; }
#msgs { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:75%; padding:9px 12px; border-radius:8px; font-size:15px; line-height:1.45; word-break:break-word; position:relative; }
.msg.mine { align-self:flex-end; background:#95ec69; }
.msg.theirs { align-self:flex-start; background:#fff; }
.msg .meta { font-size:10px; color:#999; margin-top:3px; text-align:right; }
.msg .who { font-size:11px; color:#888; margin-bottom:2px; }
.recp { font-size:10px; color:#aaa; margin-left:4px; }
#inputbar { padding:10px 12px; background:#fff; border-top:1px solid #eee; display:flex; gap:8px; align-items:flex-end; }
#inp { flex:1; border:1px solid #ddd; border-radius:8px; padding:10px 12px; font-size:16px; outline:none; min-height:42px; max-height:120px; resize:none; }
#sendbtn { background:#07c160; color:#fff; padding:10px 22px; align-self:flex-end; }

/* 空态 */
.empty { text-align:center; color:#999; padding:60px 20px; font-size:14px; }
</style>
</head>
<body>

<!-- 登录/注册 -->
<div id="auth">
  <h1>wxlike</h1>
  <div class="auth-err" id="authErr"></div>
  <input id="aUser" placeholder="用户名" autocomplete="username">
  <input id="aPass" type="password" placeholder="密码" autocomplete="current-password">
  <div class="auth-row">
    <button class="btn-primary" id="loginBtn">登录</button>
    <button class="btn-ghost" id="regBtn">注册并登录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <div id="sidebar">
    <div id="me"><b id="meUser"></b><span style="display:flex;gap:8px"><span id="devicesBtn" class="mini-btn">设备</span><span id="newGrp" class="mini-btn">+ 建群</span><span id="logout">退出</span></span></div>
    <div id="convs"></div>
  </div>
  <div id="chatbox">
    <div id="chathead" class="hidden">
      <span id="chatback">←</span>
      <div>
        <b id="chatName"></b>
        <div class="st" id="chatStatus"></div>
      </div>
      <span id="grpInfo" class="mini-btn hidden" style="margin-left:auto">群信息</span>
    </div>
    <div id="msgs"><div class="empty">选择会话开始聊天</div></div>
    <div id="inputbar" class="hidden">
      <textarea id="inp" placeholder="输入消息..."></textarea>
      <button id="sendbtn">发送</button>
    </div>
  </div>
</div>

<script src="/app/app.js"></script>

<!-- 群信息 modal -->
<div id="modal" class="hidden">
  <div class="mask" id="modalMask"></div>
  <div class="panel">
    <h3 id="gTitle">群信息</h3>
    <div id="gMembers"></div>
    <div class="grp-ops">
      <div class="op-row"><input id="gAddUser" placeholder="用户名"></div>
      <button class="btn-op" id="gAdd">加人</button>
      <button class="btn-op" id="gTransfer">转让群主</button>
      <button class="btn-op danger" id="gKick">踢人</button>
      <button class="btn-op danger" id="gLeave">退群</button>
      <button class="btn-op danger" id="gDissolve">解散群</button>
    </div>
  </div>
</div>
<style>
#modal { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; }
#modal.hidden { display:none; }
.mask { position:absolute; inset:0; background:rgba(0,0,0,.4); }
.panel { position:relative; background:#fff; width:min(90vw,340px); border-radius:12px; padding:20px; max-height:70vh; overflow-y:auto; }
.panel h3 { margin-bottom:12px; font-size:17px; }
.member { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f2f2f2; font-size:14px; }
.member .owner-tag { color:#07c160; font-size:11px; }
.member.me { color:#333; font-weight:600; }
.grp-ops { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.op-row input { width:100%; padding:8px; border:1px solid #ddd; border-radius:6px; font-size:14px; }
.btn-op { width:100%; padding:9px; border:none; border-radius:6px; font-size:14px; background:#07c160; color:#fff; cursor:pointer; }
.btn-op.danger { background:#f5f5f5; color:#e64340; }
#devModal { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; }
#devModal.hidden { display:none; }
.dev-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f2f2f2; }
.dev-item .meta { font-size:13px; color:#333; }
.dev-item .sub { font-size:11px; color:#999; margin-top:2px; }
.dev-item .kick { font-size:12px; color:#e64340; cursor:pointer; background:0; border:0; padding:6px 10px; }
.dev-item .this { font-size:11px; color:#07c160; margin-left:6px; }
</style>

<!-- 设备管理 modal -->
<div id="devModal" class="hidden">
  <div class="mask" id="devMask"></div>
  <div class="panel">
    <h3>我的设备 <span style="font-size:12px;color:#999;font-weight:400">(在线设备)</span></h3>
    <div id="devList"><div class="empty">加载中...</div></div>
  </div>
</div>
</body>
</html>
